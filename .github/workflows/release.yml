name: Release

on:
  push:
    tags:
      - 'V*.*.*'  # Trigger on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  LIBRARY_PROJECT: CDS.SQLiteLogging/CDS.SQLiteLogging.csproj
  TEST_PROJECT: CDS.SQLiteLogging.Tests/CDS.SQLiteLogging.Tests.csproj
  PACKAGE_ID: CDS.SQLiteLogging

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write

    environment: nuget
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for MinVer

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    
    - name: Restore dependencies
      run: |
        dotnet restore ${{ env.LIBRARY_PROJECT }}
        dotnet restore ${{ env.TEST_PROJECT }}
    
    - name: Build package project
      run: dotnet build ${{ env.LIBRARY_PROJECT }} --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet run --project ${{ env.TEST_PROJECT }} --configuration Release -- --report-trx

    - name: Pack NuGet package
      run: dotnet pack ${{ env.LIBRARY_PROJECT }} --configuration Release --no-build --output ./artifacts

    - name: Generate SBOM
      run: |
        dotnet tool install --global CycloneDX
        $version = (Get-ChildItem -Path ./artifacts -Filter "${{ env.PACKAGE_ID }}.*.nupkg").BaseName.Substring("${{ env.PACKAGE_ID }}".Length + 1)
        dotnet-CycloneDX ${{ env.LIBRARY_PROJECT }} -o ./artifacts -F json -sv $version

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ./artifacts/*.nupkg

    - name: Attest SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-path: ./artifacts/*.nupkg
        sbom-path: ./artifacts/bom.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
          ./artifacts/bom.json
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Authenticate with NuGet (Trusted Publishing)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nuget-auth
      with:
        user: ${{ secrets.NUGET_USER }}
    
    - name: Push to NuGet.org
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $pkg = (Get-ChildItem -Path ./artifacts -Filter "${{ env.PACKAGE_ID }}.*.nupkg").FullName
        dotnet nuget push $pkg --api-key ${{ steps.nuget-auth.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
