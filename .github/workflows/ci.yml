name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  LIBRARY_PROJECT: CDS.SQLiteLogging/CDS.SQLiteLogging.csproj
  TEST_PROJECT: CDS.SQLiteLogging.Tests/CDS.SQLiteLogging.Tests.csproj
  VIEWS_PROJECT: CDS.SQLiteLogging.Views/CDS.SQLiteLogging.Views.csproj
  WINFORMS_PROJECT: WinFormsTest/WinFormsTest.csproj
  CONSOLE_PROJECT: ConsoleTest/ConsoleTest.csproj
  BENCHMARK_PROJECT: Benchmarking/Benchmarking.csproj

jobs:
  build-and-test:
    name: Build Core Library & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for MinVer to calculate version from git history
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    
    - name: Restore core projects
      run: |
        dotnet restore ${{ env.LIBRARY_PROJECT }}
        dotnet restore ${{ env.TEST_PROJECT }}
    
    - name: Build core library
      run: dotnet build ${{ env.LIBRARY_PROJECT }} --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet run --project ${{ env.TEST_PROJECT }} --configuration Release -- --report-trx --coverage --coverage-output-format cobertura
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: test-results-${{ matrix.os }}
        path: '**/*.trx'
    
    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: coverage-report
        path: '**/*.cobertura.xml'

  build-windows-projects:
    name: Build Windows Projects
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore Windows projects
      run: |
        dotnet restore ${{ env.VIEWS_PROJECT }}
        dotnet restore ${{ env.WINFORMS_PROJECT }}
        dotnet restore ${{ env.CONSOLE_PROJECT }}
        dotnet restore ${{ env.BENCHMARK_PROJECT }}

    - name: Build Windows projects
      run: |
        dotnet build ${{ env.VIEWS_PROJECT }} --configuration Release --no-restore
        dotnet build ${{ env.WINFORMS_PROJECT }} --configuration Release --no-restore
        dotnet build ${{ env.CONSOLE_PROJECT }} --configuration Release --no-restore
        dotnet build ${{ env.BENCHMARK_PROJECT }} --configuration Release --no-restore

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0 (no floating v5 tag upstream — verify with git ls-remote before bumping)
